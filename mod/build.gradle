buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

subprojects {
    apply from: rootProject.file('version.gradle')
}

static int mcKey(String v) {
    def p = v.tokenize('.').collect { it.toInteger() }
    while (p.size() < 3) p << 0
    return p[0] * 10000 + p[1] * 100 + p[2]
}

// Copies every built jar to ../resources/mods and writes the version table the launcher reads.
tasks.register('collect') {
    dependsOn subprojects.collect { "${it.path}:build" }
    doLast {
        def out = file('../resources/mods')
        out.mkdirs()
        out.listFiles().findAll { it.name.startsWith('pimpin-client-') && it.name.endsWith('.jar') }.each { it.delete() }
        def table = []
        subprojects.sort { a, b -> mcKey(a.name) <=> mcKey(b.name) }.each { p ->
            def jar = p.ext.releaseJar.get().asFile
            def name = "pimpin-client-${p.name}.jar"
            copy { from jar; into out; rename { name } }
            table << [file: name, built: p.name, covers: p.property('mc_covers').split(',') as List]
        }
        def manifest = [version: mod_version, jars: table]
        new File(out, 'pimpin-client.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
        println "Collected ${table.size()} jars into ${out}"
    }
}
