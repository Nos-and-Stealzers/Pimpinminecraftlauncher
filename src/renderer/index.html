<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self' data:"
    />
    <title>Pimpin Launcher</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-accent="violet">
    <div class="backdrop" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="pixels"></div>
    </div>

    <header class="titlebar">
      <div class="brand">
        <img src="img/logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">PIMPIN<span>LAUNCHER</span></span>
      </div>
      <div class="titlebar-center" id="task-pill"></div>
      <div class="titlebar-right">
        <div id="account-slot"></div>
        <div class="win-controls">
          <button class="win-btn" data-win="minimize" title="Minimize"></button>
          <button class="win-btn" data-win="maximize" title="Maximize"></button>
          <button class="win-btn close" data-win="close" title="Close"></button>
        </div>
      </div>
    </header>

    <nav class="rail" id="rail"></nav>
    <main class="view" id="view"></main>

    <div class="toasts" id="toasts"></div>
    <div id="modal-root"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
