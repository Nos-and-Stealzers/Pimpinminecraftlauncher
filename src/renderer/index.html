<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self' data:"
    />
    <title>Pimpin Launcher</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-theme="dark" data-accent="violet" data-appearance-pending>
    <header class="titlebar">
      <div class="brand">
        <img src="img/logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">Pimpin Launcher</span>
      </div>
      <div class="titlebar-center" id="search-slot"></div>
      <div class="titlebar-right">
        <div id="update-slot"></div>
        <div id="notif-slot"></div>
        <div id="account-slot"></div>
        <div class="win-controls">
          <button class="win-btn togl" data-win="top" title="Keep window on top"></button>
          <button class="win-btn" data-win="minimize" title="Minimize"></button>
          <button class="win-btn" data-win="maximize" title="Maximize"></button>
          <button class="win-btn close" data-win="close" title="Close"></button>
        </div>
      </div>
    </header>

    <nav class="sidebar" id="sidebar"></nav>
    <main class="view" id="view"></main>

    <div class="drop-overlay" aria-hidden="true">
      <div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <b>Drop to import</b>
        <span class="muted">.mrpack modpacks and Pimpin .zip exports</span>
      </div>
    </div>
    <div class="toasts" id="toasts"></div>
    <div id="modal-root"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
