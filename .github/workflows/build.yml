name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Test release transport (offline)
        run: node --test scripts/release-assets.test.js
        env:
          TMPDIR: ${{ runner.temp }}
      # Every build gets its own version so installed launchers can auto-update.
      # Tag wins; otherwise the committed VERSION file, falling back to run numbers.
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -s VERSION ]]; then v="$(cat VERSION | tr -d '[:space:]')"
          else v="0.1.$GITHUB_RUN_NUMBER"; fi
          echo "Building version $v"
          npm version "$v" --no-git-tag-version --allow-same-version
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
      # Release assets bypass Actions artifact storage. PR/manual builds still
      # run all checks and package both platforms, but cannot stage or publish.
      - name: Stage platform assets in private draft
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        run: node scripts/release-assets.js stage dist
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}

  # Both successful builds are required before a release becomes visible.
  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate both platforms and publish complete drafts
        run: node scripts/release-assets.js publish release-download
        env:
          GH_TOKEN: ${{ github.token }}
          # Restricted to public downloads; never used for the source repository.
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TMPDIR: ${{ runner.temp }}
